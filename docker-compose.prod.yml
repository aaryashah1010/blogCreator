services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: contentforge
      POSTGRES_PASSWORD: contentforge
      POSTGRES_DB: contentforge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contentforge"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: server/Dockerfile.prod
    ports:
      - "4000:4000"
    env_file:
      - ./server/.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
